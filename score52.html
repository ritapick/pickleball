<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Giải Đấu Pickleball - DTD Tournament Cup</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #1a5c2e 0%, #0d3318 50%, #1a5c2e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 221, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 221, 0, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 0 4px #ffdd00,
                0 0 0 8px #1a5c2e;
            max-width: 700px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .main-title {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #1a5c2e;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .sub-title {
            font-family: 'Oswald', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #1a5c2e, #2d8a47, #ffdd00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .date {
            font-size: 1.2rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 40px;
            padding: 8px 20px;
            background: linear-gradient(90deg, transparent, rgba(26, 92, 46, 0.1), transparent);
            border-radius: 30px;
            display: inline-block;
        }

        .images-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .image-card {
            display: block;
            width: 250px;
            height: 250px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            position: relative;
            border: 4px solid #1a5c2e;
        }

        .image-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 40px rgba(26, 92, 46, 0.4);
            border-color: #ffdd00;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .image-card:hover img {
            transform: scale(1.05);
        }

        .image-card::after {
            content: '▶ Click để xem';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            padding: 30px 10px 10px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-card:hover::after {
            opacity: 1;
        }

        .pickleball-decoration {
            position: fixed;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffee58, #ffdd00, #c6a700);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2), inset -2px -2px 5px rgba(0,0,0,0.1);
            z-index: 0;
            opacity: 0.6;
        }

        .ball-1 { top: 10%; left: 5%; animation: bounce 3s ease-in-out infinite; }
        .ball-2 { top: 60%; right: 8%; animation: bounce 4s ease-in-out infinite 1s; }
        .ball-3 { bottom: 15%; left: 10%; animation: bounce 3.5s ease-in-out infinite 0.5s; }
        .ball-4 { top: 25%; right: 3%; animation: bounce 4.5s ease-in-out infinite 2s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #1a5c2e, #ffdd00, #1a5c2e);
            margin: 15px auto 25px;
            border-radius: 2px;
        }

        .sport-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .sub-title {
                font-size: 2rem;
            }
            .main-title {
                font-size: 1.3rem;
            }
            .image-card {
                width: 200px;
                height: 200px;
            }
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="pickleball-decoration ball-1"></div>
    <div class="pickleball-decoration ball-2"></div>
    <div class="pickleball-decoration ball-3"></div>
    <div class="pickleball-decoration ball-4"></div>

    <div class="container">
        <div class="sport-icon">🏓</div>
        <h1 class="main-title">Quản Lý Giải Đấu Pickleball</h1>
        <div class="divider"></div>
        <h2 class="sub-title">DTD Tournament Cup</h2>
        <p class="date">📅 Ngày 12/08/2026</p>

        <div class="images-container">
            <a href="https://docs.google.com/spreadsheets/d/1niiTZS5IcM_tG6Z36ifAOpvfz_TQghP0cSua330eRCU/edit?gid=1139851199#gid=1139851199" target="_blank" class="image-card">
                <img src="48.png" alt="Bảng 1">
            </a>
            <a href="https://docs.google.com/spreadsheets/d/13UqfGXGELaCg3qJcPCZ-4_rwsLNgEJklpqvGZVPgk9o/edit?gid=453451072#gid=453451072" target="_blank" class="image-card">
                <img src="52.png" alt="Bảng 2">
            </a>
        </div>
    </div>
</body>
</html>
