<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏆DTD PICKLEBALL CUP</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --primary-color: #00f2ff;
    --secondary-color: #ccff00;
    --bg-dark: #0a0a0a;
    --glass-bg: rgba(20, 20, 25, 0.85);
    --text-gradient: linear-gradient(90deg, #ffffff, #00f2ff);
  }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Oswald', sans-serif;
    background-color: var(--bg-dark);
    background-image: url('https://image.qwenlm.ai/public_source/4a049a49-0398-4b5b-93ea-9691e7b8a93e/16bfa2e7b-4d27-460a-835b-ffc3d74c517a.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%);
    z-index: -1;
  }

  .top-bar {
    width: 100%;
    max-width: 480px;
    padding: 15px 20px;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .weather-widget {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #ddd;
    text-shadow: 0 1px 2px black;
  }

  .time-widget {
    font-weight: 700;
    font-size: 18px;
    color: var(--primary-color);
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
  }

  .main-wrapper {
    width: 100%;
    max-width: 480px;
    padding: 20px;
    box-sizing: border-box;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .sponsors-section {
    margin-bottom: 40px;
    animation: slideDown 0.6s ease-out;
    padding: 15px;
    border-radius: 15px;
    background: var(--glass-bg);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .sponsors-title {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--secondary-color);
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 15px;
    text-shadow: 0 0 8px rgba(204, 255, 0, 0.4);
    position: relative;
  }

  .sponsors-title::before,
  .sponsors-title::after {
    content: '';
    display: inline-block;
    width: 25px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--secondary-color), transparent);
    vertical-align: middle;
    margin: 0 10px;
  }

  .sponsors-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    max-width: 280px;
    margin: 0 auto;
    padding: 5px 0;
  }

  .sponsor-item {
    width: 80px;
    height: 80px;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    background: linear-gradient(145deg, #1f1f1f, #0f0f0f);
    border: 2px solid rgba(255,255,255,0.1);
    padding: 6px;
    box-sizing: border-box;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sponsor-item::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(from 0deg, transparent, var(--primary-color), transparent 30%);
    opacity: 0;
    animation: rotate 4s linear infinite;
    transition: opacity 0.3s;
  }

  .sponsor-item::after {
    content: '';
    position: absolute;
    inset: 2px;
    border-radius: 10px;
    background: linear-gradient(145deg, #1f1f1f, #0f0f0f);
    z-index: 1;
  }

  .sponsor-item img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 2;
    filter: brightness(1) contrast(1);
    transition: transform 0.3s, filter 0.3s;
  }

  .sponsor-item:hover {
    transform: translateY(-5px) scale(1.08);
    border-color: var(--primary-color);
    box-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
  }

  .sponsor-item:hover::before { opacity: 0.6; }

  .sponsor-item:hover img {
    transform: scale(1.1);
    filter: brightness(1.2) drop-shadow(0 0 8px rgba(0, 242, 255, 0.6));
  }

  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .title-box {
    text-align: center;
    margin-bottom: 50px;
    animation: slideDown 0.8s ease-out;
  }

  .main-title {
    font-size: 32px;
    font-weight: 700;
    text-transform: uppercase;
    margin: 0;
    background: var(--text-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    line-height: 1.1;
  }

  .sub-title {
    font-size: 20px;
    color: var(--secondary-color);
    font-weight: 600;
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .date-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 15px;
    border: 1px solid var(--primary-color);
    border-radius: 20px;
    font-size: 14px;
    color: white;
    background: rgba(0, 242, 255, 0.1);
    backdrop-filter: blur(5px);
  }

  .card-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    width: 100%;
  }

  .card-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .card-item:hover { transform: translateY(-10px); }

  .img-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 15px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    background: #1a1a1a;
  }

  .card-item img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: opacity 0.3s;
  }

  .card-item:hover .img-wrapper {
    border-color: var(--primary-color);
    box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
  }

  .card-label {
    margin-top: 15px;
    font-size: 18px;
    font-weight: 600;
    color: white;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px black;
    position: relative;
    text-align: center;
  }

  .card-label::after {
    content: '';
    display: block;
    width: 0%;
    height: 2px;
    background: var(--secondary-color);
    margin: 5px auto 0;
    transition: width 0.3s;
  }

  .card-item:hover .card-label::after { width: 100%; }

  .footer-link {
    margin-top: 50px;
    text-align: center;
    animation: fadeInUp 1s ease-out;
  }

  .btn-facebook {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(45deg, #1877f2, #005bea);
    color: white;
    padding: 15px 30px;
    border-radius: 50px;
    font-weight: bold;
    font-size: 16px;
    text-decoration: none;
    box-shadow: 0 4px 15px rgba(24, 119, 242, 0.4);
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .btn-facebook:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(24, 119, 242, 0.6);
    background: linear-gradient(45deg, #005bea, #1877f2);
  }

  /* ===== NEW SECTION: Vị trí sân thi đấu & Hình ảnh giải đấu ===== */
  .info-cards-wrapper {
    margin-top: 50px;
    width: 100%;
  }

  .info-cards-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    width: 100%;
    animation: fadeInUp 1s ease-out;
  }

  .info-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    padding: 20px 15px;
    border-radius: 15px;
    background: var(--glass-bg);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
    min-height: 140px;
    justify-content: center;
  }

  .info-card::before {
    content: '';
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    background: linear-gradient(45deg, var(--primary-color), transparent, var(--secondary-color));
    border-radius: 15px;
    opacity: 0;
    z-index: -1;
    transition: opacity 0.3s;
  }

  .info-card:hover {
    transform: translateY(-8px) scale(1.03);
    border-color: var(--primary-color);
    box-shadow: 0 15px 35px rgba(0, 242, 255, 0.3), 0 0 25px rgba(0, 242, 255, 0.2);
  }

  .info-card:hover::before {
    opacity: 0.3;
  }

  .info-card-icon {
    font-size: 38px;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.6));
    transition: transform 0.4s ease;
  }

  .info-card:hover .info-card-icon {
    transform: scale(1.2) rotate(-5deg);
  }

  .info-card-title {
    font-size: 14px;
    font-weight: 600;
    color: white;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
    text-shadow: 0 2px 4px black;
    line-height: 1.3;
  }

  .info-card-cta {
    margin-top: 10px;
    font-size: 11px;
    color: var(--secondary-color);
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.8;
    transition: opacity 0.3s;
  }

  .info-card:hover .info-card-cta {
    opacity: 1;
    color: var(--primary-color);
  }

  .footer-credit {
    text-align: center;
    margin-top: 40px;
    margin-bottom: 20px;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
  }

  @keyframes slideDown {
    from { transform: translateY(-50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  @keyframes fadeInUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  @media (max-width: 350px) {
    .main-title { font-size: 26px; }
    .card-label { font-size: 16px; }
    .sponsor-item { 
      width: 70px; 
      height: 70px;
    }
    .sponsors-grid { 
      gap: 15px;
      max-width: 240px;
    }
    .sponsors-title { font-size: 12px; letter-spacing: 2px; }
    .info-card { padding: 15px 10px; min-height: 120px; }
    .info-card-icon { font-size: 32px; }
    .info-card-title { font-size: 12px; }
    .info-cards-container { gap: 10px; }
  }
</style>
</head>
<body>

<script>
  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock-display').textContent = `${hours}:${minutes}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  function getSimulatedWeather() {
    const hour = new Date().getHours();
    let temp = 22;
    let icon = "☁️";
    if (hour >= 11 && hour <= 14) { temp = 26; icon = "⛅"; }
    else if (hour >= 15 && hour <= 18) { temp = 24; icon = "🌤️"; }
    else if (hour >= 19 || hour <= 6) { temp = 19; icon = "🌙"; }
    temp += Math.floor(Math.random() * 3) - 1;
    return { temp, icon };
  }

  function updateWeather() {
    const weatherData = getSimulatedWeather();
    document.getElementById('weather-temp').textContent = `${weatherData.temp}°C`;
    document.getElementById('weather-icon').textContent = weatherData.icon;
  }
  updateWeather();
</script>
